name: Generate Signing Key

on:
  workflow_dispatch:

jobs:
  generate-key:
    name: Generate Morphe Signing Key
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run generateSigningKey
        run: ./gradlew generateSigningKey

      - name: Commit and push public key
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add morphe-signing.pub
          git commit -m "chore(signing): update public signing key [skip ci]" || echo "No changes to morphe-signing.pub"
          git push origin main

      - name: Display Private Key instructions
        run: |
          KEY_CONTENT=$(cat morphe-signing.key)
          echo "## 🔑 Your Birdy Patches Signing Key" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Steps to activate your signing key:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to repository: **Settings > Secrets and variables > Actions**" >> $GITHUB_STEP_SUMMARY
          echo "2. Click **New repository secret**" >> $GITHUB_STEP_SUMMARY
          echo "3. Name: \`MORPHE_SIGNING_KEY\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Secret: Copy and paste the key below:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$KEY_CONTENT" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 Once added, trigger the **Release** workflow or run \`sync.bat\` to publish your signed release for Morphe Manager!" >> $GITHUB_STEP_SUMMARY
